# Проверка админки на каждом PR: сборка + страницы в браузере + прокси к каналу.
# Что именно проверяется — frontend/scripts/check-admin/index.mjs
name: Проверка админки

on:
  pull_request:
    paths:
      - 'frontend/**'
      # API канала: по нему сверяются прокси
      - 'channel/src/api.js'
      # подставные данные берут описание конвейера и форматы прямо отсюда
      - 'channel/src/assembly.js'
      - 'channel/src/formats.js'
      - 'channel/src/prompts.js'
      - '.github/workflows/check-admin.yml'
  workflow_dispatch:

jobs:
  check-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Браузер для проверки
        run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - name: Страницы и прокси
        run: npm run check:admin
        env:
          CHECK_ADMIN_SCREENSHOTS: ${{ runner.temp }}/screenshots
      # скриншоты того, что видела проверка, — в артефактах прогона
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
